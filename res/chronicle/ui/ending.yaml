# The end of a life: a veil over the Life page and, in its middle, what the chronicle keeps of him.
#
# Built by LifeScene (examples/Chronicle/Scenes/lifescene.cpp) over the page when a life ends,
# and removed when the next one begins. This file is layout and placeholder content only: the
# name is the save's, the cause, the story, the figures and the last line are rules/epitaph.pg's.
#
# The veil is sized to the window by the scene (LifeScene::fitEnding, on every resize: anchors
# on both sides do not stretch a shape) and takes the mouse, so nothing of the
# page under it is hovered or clicked; the leaf stands in the window's middle and grows with what
# it says. z: the Overlay band, 100-129 (the veil 100, the leaf 104, its content 114), over the
# page's panels (10-59) and under the tooltips (200).
name: ending
children:

  - kind: Shape2D
    name: veil
    width: 1320
    height: 1020
    z: 100
    theme: ending.veil

  - kind: Panel
    name: leaf
    frame: illuminated
    width: 520
    heading: The chronicle closes
    glyph: skull
    z: 104
    contentZ: 114
    anchors:
      - {side: horizontalCenter, target: __MainWindow, targetSide: horizontalCenter}
      - {side: verticalCenter, target: __MainWindow, targetSide: verticalCenter}
    children:
      - {kind: Label, name: endName, style: title, overflow: wrap, text: Aldren of Bellmoor}
      - {kind: Label, name: endCause, style: gloss, color: ink-muted, overflow: wrap, text: "He died an old man, in his thirty-third year."}
      - {kind: Ornament, ornament: divider, knot: false}
      - kind: Label
        name: endStory
        style: body
        overflow: wrap
        text: "He chose no class, and lived by the work of his hands. Nothing he did was written down. He left nothing but his name."
      - {kind: Label, name: endTally, style: label, color: ink-muted, overflow: wrap, text: "AGE 33 · WORKS 0 · COIN 0 · DEEDS 0"}
      # The gift at death: what he holds can be left to a place of the town, counted toward its
      # next level. The scene shows the two only to who knows the town and holds any coin, and
      # fills `gifts` with a small button a place (tags life.gift.<place id>)
      - {kind: Label, name: giftLabel, style: label, color: ink-muted, overflow: wrap, text: "LEAVE HIS 84 COIN TO"}
      - kind: Layout:Vertical
        name: gifts
        spacing: 6
      - kind: Button
        name: again
        variant: seal
        label: Begin a new life
        glyph: seal
        tag: life.again
      # Under everything, of a life lived to its end only (epitaph.pg's `ask`): a word asked of
      # who played it, as small as the page writes. The scene takes it out of the leaf otherwise
      - kind: Label
        name: endAsk
        style: body-sm
        color: ink-muted
        overflow: wrap
        text: "The chronicle is still being written. If this life was worth the telling, a comment or a rating on the game's page helps it along."
