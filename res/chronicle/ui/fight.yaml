# A fight of a walk: it takes the on-site screen's place (expedition.yaml) and gives it back.
#
# Built by LifeScene (examples/Chronicle/Scenes/lifewalk.cpp) when a beast sought is found, and
# removed when he goes back to the woods. Layout and placeholder content only: every word and
# figure is rules/expedition.pg's, written by name (LifeScene::fillFight).
#
# Under a head: the beasts across the top, a panel each, the size of
# his own (its name, how it stands over its rule, the move it means to make by its name alone,
# and the rule of that move, which fills before it is told); under them, side by side and level,
# he himself (280) and his turn: a button a thing he may do, what anyone can and then what he
# has learned in his life, pressed and done. So the beasts are above and he is below. At the
# right (376): the order of the turn in a panel of its own, who acts when and what is coming,
# and under it, down the rest of the height, the account of the fight.
#
# What a thing does is said by its gloss, not on the page: a beast's (hover how it stands), its
# move's (hover the move: what it does to him is said only once it has been used on him, or once
# he has watched the beast), and each button's (what the move would do, before it is done).
# The buttons of his turn are made by the scene (LifeScene::fillMoves): they change with what he
# has learned, what he holds and what he fights.
#
# A blow is seen coming: his rule (heroCast) or the beast's (foeCast0..3) fills, then the blow is
# told in the account, the rule of who was hit flashes and falls, and what was taken lifts off it
# (LifeScene::runTelling).
# z: the Overlay band, 100-129 (the veil 100, the head and the panels 104, their content 114).
name: fight
children:

  - kind: Shape2D
    name: veil
    width: 1320
    height: 1020
    z: 100
    theme: scene.background

  # -- Head: what he fights, the turn, and what the fight costs the stay --
  - {kind: Label, name: kicker, x: 16, y: 10, z: 104, style: label, color: ink-muted, overflow: ellipsis, width: 760, text: "THE HOLLOW WOODS · DAY 12 · A FIGHT"}
  - {kind: Label, name: fightTitle, x: 16, y: 28, z: 104, style: heading, overflow: ellipsis, width: 760, text: Wolf pack}

  - kind: Label
    name: turn
    z: 104
    style: figure-xl
    overflow: ellipsis
    width: 240
    align: right
    text: "TURN 4"
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 16}
      - {side: top, target: __MainWindow, targetSide: top, margin: 6}

  - kind: Label
    name: turnNote
    z: 104
    style: label
    color: status-time
    overflow: ellipsis
    width: 620
    align: right
    text: "FIGHT COST · 3 TURNS = 1 DAY · 2 DAYS SO FAR · 17 DAYS LEFT ON SITE"
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 16}
      - {side: top, target: __MainWindow, targetSide: top, margin: 44}

  # -- Left and middle: the beasts across the top, a panel each; under them he, and his turn beside him --
  - kind: Layout:Vertical
    name: walkLeft
    x: 16
    y: 72
    z: 104
    width: 920
    height: 880
    scrollable: true
    spacing: 12
    children:
      - kind: Layout:Horizontal
        name: foeRow
        width: 916
        height: 176
        spacing: 12
        children:
          - kind: Panel
            name: foePanel0
            frame: ruled
            width: 280
            z: 104
            contentZ: 114
            heading: First wolf
            glyph: adventure
            aside: AIMED AT       # against several, on the one his blows go to
            children:
              - {kind: Label, name: foeLife0, style: label, overflow: wrap, text: "VITALITY 12 OF 16"}
              - {kind: ProgressRule, name: foeBar0, nib: false, percent: 75}
              - {kind: Label, name: foeIntent0, style: label, color: vermilion, overflow: wrap, text: BITE}
              - {kind: ProgressRule, name: foeCast0, nib: false, small: true, percent: 0}

          - kind: Panel
            name: foePanel1
            frame: ruled
            width: 280
            z: 104
            contentZ: 114
            heading: Second wolf
            glyph: adventure
            aside: AIMED AT       # against several, on the one his blows go to
            children:
              - {kind: Label, name: foeLife1, style: label, overflow: wrap, text: "VITALITY 12 OF 16"}
              - {kind: ProgressRule, name: foeBar1, nib: false, percent: 75}
              - {kind: Label, name: foeIntent1, style: label, color: vermilion, overflow: wrap, text: BITE}
              - {kind: ProgressRule, name: foeCast1, nib: false, small: true, percent: 0}

          - kind: Panel
            name: foePanel2
            frame: ruled
            width: 280
            z: 104
            contentZ: 114
            heading: Third wolf
            glyph: adventure
            aside: AIMED AT       # against several, on the one his blows go to
            children:
              - {kind: Label, name: foeLife2, style: label, overflow: wrap, text: "VITALITY 12 OF 16"}
              - {kind: ProgressRule, name: foeBar2, nib: false, percent: 75}
              - {kind: Label, name: foeIntent2, style: label, color: vermilion, overflow: wrap, text: BITE}
              - {kind: ProgressRule, name: foeCast2, nib: false, small: true, percent: 0}

          - kind: Panel
            name: foePanel3
            frame: ruled
            width: 280
            z: 104
            contentZ: 114
            heading: Fourth wolf
            glyph: adventure
            aside: AIMED AT       # against several, on the one his blows go to
            children:
              - {kind: Label, name: foeLife3, style: label, overflow: wrap, text: "VITALITY 12 OF 16"}
              - {kind: ProgressRule, name: foeBar3, nib: false, percent: 75}
              - {kind: Label, name: foeIntent3, style: label, color: vermilion, overflow: wrap, text: BITE}
              - {kind: ProgressRule, name: foeCast3, nib: false, small: true, percent: 0}

      - kind: Layout:Horizontal
        name: duelRow
        width: 916
        height: 620
        spacing: 12
        children:
          - kind: Panel
            name: heroPanel
            frame: ruled
            width: 280
            z: 104
            contentZ: 114
            heading: Aldren
            glyph: strength
            children:
              - {kind: Label, name: heroVit, style: label, overflow: wrap, text: "VITALITY 49 OF 90"}
              - {kind: ProgressRule, name: heroBar, nib: false, percent: 54}
              - {kind: Label, name: low, style: label, color: vermilion, overflow: wrap, text: ""}
              # His breath, for who has learned something to spend it on: out of the stack otherwise
              - {kind: Label, name: breath, style: label, color: lapis, overflow: wrap, text: "BREATH 3 OF 5"}
              - {kind: ProgressRule, name: breathBar, nib: false, small: true, percent: 60}
              # His blow, about to go: the rule fills, then the blow is told in the account
              - {kind: Label, name: heroMove, style: label, color: ink-muted, overflow: wrap, text: HIS BLOW}
              - {kind: ProgressRule, name: heroCast, nib: false, small: true, percent: 0}
              - kind: ResourceLedger
                name: hero

          - kind: Panel
            name: menuPanel
            frame: ruled
            width: 616
            z: 104
            contentZ: 114
            heading: Your turn
            glyph: swordsmanship
            children:
              # Against several, the one aimed at: a button each, the scene's to make (the one aimed at
              # in lapis). Against one there is nothing to choose, and neither is there
              - {kind: Label, name: aimNote, style: label, color: ink-muted, overflow: wrap, text: AIM AT}
              - kind: Layout:Vertical
                name: aims
                spacing: 6
              # What he may do, a button each, the scene's to make: pressed, it is done. Its gloss says
              # what it would do
              - kind: Layout:Vertical
                name: moves
                spacing: 6
              - {kind: Label, name: moveNote, style: body-sm, color: ink-muted, overflow: wrap, text: "Hover a move to read what it does."}
              - kind: Button
                name: hand
                variant: quiet
                label: "Let him fight on, this turn and after"
                glyph: time
                tag: walk.hand
              # Once the fight is over: what it came to, and the way back
              - {kind: Label, name: spoils, style: body, overflow: wrap, text: ""}
              - kind: Button
                name: act
                variant: seal
                label: Back to the woods
                glyph: gate
                tag: walk.act

  # -- Right: the order of the turn, and the account of the fight --
  - kind: Layout:Vertical
    name: walkRight
    z: 104
    width: 380
    height: 880
    scrollable: true
    spacing: 12
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 12}
      - {side: top, target: __MainWindow, targetSide: top, margin: 72}
    children:
      # Who acts when this turn, one under the other: he in lapis where he stands, each beast
      # with the move it means to make. Under them what is coming at him, and why he is first
      # or not. A place of the order no one stands in is out of the stack
      - kind: Panel
        name: orderPanel
        frame: ruled
        width: 376
        z: 104
        contentZ: 114
        heading: The timeline
        glyph: time
        aside: TURN 1 OF 4 · DAY 1      # how far into his day he is (the duel's dayText)
        children:
          # Who acts when, in time: his actions over the line, the beasts' under it, the end of his day; the
          # scene draws them in this box (LifeScene::fillTimeline), the move under the mouse moving them
          - {kind: Shape2D, name: timeline, width: 344, height: 132, theme: timeline.ground}
          - {kind: Label, name: warn, style: label, color: vermilion, overflow: wrap, text: "2 BLOWS COMING · 8–14 IF ALL LAND"}
          - {kind: Label, name: quick, style: label, color: ink-muted, overflow: wrap, text: "QUICKNESS 11 AGAINST 9: HE ACTS FIRST"}

      - kind: Panel
        name: accountPanel
        frame: ruled
        width: 376
        z: 104
        contentZ: 114
        heading: The account
        glyph: quill
        children:
          - kind: EventLog
            name: account
            height: 360
            years: false
            steps: true          # the first column counts: a step of the record, a turn of the fight
            newest: true         # the newest line on top, as a chat reads
          - {kind: Label, name: footnote, style: label, color: status-time, overflow: wrap, text: "WRITTEN SO FAR · 2 DAYS · −14 VITALITY · A RETREAT KEEPS THE DAYS"}
