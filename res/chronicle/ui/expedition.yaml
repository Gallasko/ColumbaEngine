# A walk outside the town, on site: the screen he lives on from his arrival to his way home.
#
# Built by LifeScene (examples/Chronicle/Scenes/lifewalk.cpp) over the Life page when a walk
# begins, and removed when he turns for home; a fight takes its place (fight.yaml) and gives it
# back. This file is layout and placeholder content only: every word and figure is
# rules/expedition.pg's, written by name (LifeScene::fillSite).
#
# Three columns under a head and a strip of days, laid as the Life page is: at the left (300)
# how he stands (his Vitality, how well the place is known), what he carries and what going home
# now would come to, with the way home; in the middle (the rest) what he may do, as tiles, under
# an event waiting for his answer; at the right (360) what he has taken, over the record so far.
# Each column is a layout that scrolls. The scene writes the columns' widths for the window
# before it builds the page (lifewalk.cpp, shapeWalk) and sets their heights on every resize; in
# a window too narrow for three columns it builds expedition-narrow.yaml, the same pieces in one.
#
# A story (rules/storylib.pg) is played on the same page: the strip is its gauge of the days
# ("Day 3 of 16 · 4 months gone") with the stage's title over its end, the stage's text under the
# title on its first day only, a tile new that day in the adventure's look, what is no longer
# offered under the tiles, and how he stands in words under his Vitality.
#
# A beast or a work is chosen among its tiles, then done by the button under them, as a work is
# begun on the Life page; a second click on the tile does it too.
# z: the Overlay band, 100-129 (the veil 100, the head and the panels 104, their content 114).
name: expedition
children:

  - kind: Shape2D
    name: veil
    width: 1320
    height: 1020
    z: 100
    theme: scene.background

  # -- Head: where he is, and what is left of the stay --
  - {kind: Label, name: kicker, x: 16, y: 10, z: 104, style: label, color: ink-muted, overflow: ellipsis, width: 760, text: "HUNT · ON SITE · FIRST WALK BY HAND"}
  - {kind: Label, name: zoneTitle, x: 16, y: 28, z: 104, style: heading, overflow: ellipsis, width: 760, text: The Hollow Woods}
  - {kind: Label, name: zoneLine, x: 16, y: 60, z: 104, style: gloss, color: ink-muted, overflow: ellipsis, width: 760, text: "Old oaks north of the mill road. The wolves there hunt in threes."}

  - kind: Label
    name: daysLeft
    z: 104
    style: figure-xl
    color: status-time
    overflow: ellipsis
    width: 120
    align: right
    text: "19"
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 16}
      - {side: top, target: __MainWindow, targetSide: top, margin: 6}

  - kind: Label
    name: daysNote
    z: 104
    style: label
    color: status-time
    overflow: ellipsis
    width: 240
    align: right
    text: DAYS LEFT ON SITE
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 16}
      - {side: top, target: __MainWindow, targetSide: top, margin: 44}

  - kind: Label
    name: headNote
    z: 104
    style: label
    color: ink-muted
    overflow: ellipsis
    width: 520
    align: right
    text: "HOME AT 14.6"
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 16}
      - {side: top, target: __MainWindow, targetSide: top, margin: 62}

  # -- The strip of days: spent solid, the rest of the stay to come --
  - kind: ProgressRule
    name: strip
    x: 16
    y: 88
    z: 104
    width: 1288
    percent: 37
    nib: false
    caption: "11 AP SPENT · 19 LEFT · THE WALK HOME IS 2 WEEKS WHATEVER HAPPENS"

  # -- Left: how he stands, what he carries, and the way home --
  - kind: Layout:Vertical
    name: walkLeft
    x: 16
    y: 136
    z: 104
    width: 304
    height: 860
    scrollable: true
    spacing: 12
    children:
      - kind: Panel
        name: statePanel
        frame: ruled
        width: 300
        z: 104
        contentZ: 114
        heading: Aldren
        glyph: vitality
        children:
          # What the walk hangs on, where it is seen: his Vitality in the field, and how well the
          # place is known, each over its rule
          - {kind: Label, name: vitality, style: label, overflow: wrap, text: "VITALITY 49 OF 90"}
          - {kind: ProgressRule, name: vitalityBar, nib: false, percent: 54}
          # In a story, how he stands before its masters, in words (never a figure); hidden on a walk
          - {kind: Label, name: standing, style: body-sm, overflow: wrap, text: "The masters would look on him kindly."}
          - {kind: Label, name: knowledge, style: label, color: lapis, overflow: wrap, text: "ZONE KNOWLEDGE 1 OF 4"}
          - {kind: ProgressRule, name: knowledgeBar, nib: false, small: true, percent: 25}
          - {kind: Label, name: knowledgeNote, style: body-sm, color: ink-muted, overflow: wrap, text: "Study 0 of 3 to knowledge 2: the rare beasts are listed, and every beast is found a day sooner."}

      - kind: Panel
        name: bagPanel
        frame: ruled
        width: 300
        z: 104
        contentZ: 114
        heading: In the bag
        glyph: trade
        children:
          - kind: ResourceLedger
            name: bag

      - kind: Panel
        name: homePanel
        frame: ruled
        width: 300
        z: 104
        contentZ: 114
        heading: If you turned home now
        glyph: gate
        children:
          - kind: ResourceLedger
            name: home
          # The way home: asked twice, the first press says what is lost
          - {kind: Label, name: leaveNote, style: label, color: vermilion, overflow: wrap, text: THE CALENDAR DOES NOT SHORTEN}
          - kind: Button
            name: leave
            variant: quiet
            label: Turn for home
            glyph: gate
            tag: walk.leave
          - {kind: Label, name: scribe, style: gloss, color: ink-muted, overflow: wrap, text: "Each day is chosen when it comes; the record remembers all of them."}

  # -- Middle: an event waiting for his answer, then what he may do --
  - kind: Layout:Vertical
    name: walkMiddle
    x: 332
    y: 136
    z: 104
    width: 620
    height: 860
    scrollable: true
    spacing: 12
    children:
      - kind: Panel
        name: cardPanel
        frame: ruled
        width: 616
        z: 104
        contentZ: 114
        heading: Something on the way
        glyph: seal
        children:
          - {kind: Label, name: cardTitle, style: title, color: vermilion, overflow: wrap, text: A hunter of the Keep}
          - {kind: Label, name: cardText, style: body, overflow: wrap, text: "A man in the Keep's green sits by a cold fire, his leg bound."}
          - {kind: Button, name: option0, variant: quiet, label: Give him a ration, tag: walk.option.0}
          - {kind: Label, name: optionLine0, style: body-sm, color: ink-muted, overflow: wrap, text: "1 AP · −1 ration"}
          - {kind: Button, name: option1, variant: quiet, label: Ask what he saw, tag: walk.option.1}
          - {kind: Label, name: optionLine1, style: body-sm, color: ink-muted, overflow: wrap, text: "0 AP"}
          - {kind: Button, name: option2, variant: quiet, label: Leave him, tag: walk.option.2}
          - {kind: Label, name: optionLine2, style: body-sm, color: ink-muted, overflow: wrap, text: "0 AP"}
          - {kind: Button, name: option3, variant: quiet, label: Walk on, tag: walk.option.3}
          - {kind: Label, name: optionLine3, style: body-sm, color: ink-muted, overflow: wrap, text: "0 AP"}
          - {kind: Label, name: cardFoot, style: gloss, color: ink-muted, overflow: wrap, text: "The choice is written to the record; a walk by the record makes it again."}

      - kind: Panel
        name: seekPanel
        frame: ruled
        width: 616
        z: 104
        contentZ: 114
        heading: Seek a beast
        glyph: adventure
        children:
          - kind: ActivityList
            name: seeks
            id: walk.seeks
            stripes: false
            compact: true         # a tile is its name, its cost and one line under them: how rare it is and how well he knows it
            tileWidth: 148        # as many to a line as fit at that width or more, as the choice's are on the Life page
          - kind: Layout:Horizontal
            name: seekButtons
            height: 36
            spacing: 8
            children:
              - kind: Button
                name: seek
                variant: seal
                label: Seek
                glyph: adventure
                cost: 2 AP
                tag: walk.seek
              - kind: Button
                name: observe
                variant: study
                label: Watch it
                glyph: study
                cost: 1 AP
                tag: walk.observe
          # Under the buttons, so that what it says never moves them: what is known of the beast chosen
          - {kind: Label, name: seekNote, style: body-sm, color: ink-muted, overflow: wrap, text: "Choose a beast, then seek it or watch it."}

      - kind: Panel
        name: workPanel
        frame: ruled
        width: 616
        z: 104
        contentZ: 114
        heading: Field work
        glyph: work
        children:
          - kind: ActivityList
            name: works
            id: walk.works
            stripes: false
            compact: true
            tileWidth: 148
          - kind: Button
            name: work
            variant: quiet
            label: Do it
            glyph: work
            cost: 1 AP
            tag: walk.work
          - {kind: Label, name: workNote, style: body-sm, color: ink-muted, overflow: wrap, text: "Choose a work, then do it. Hover one to read what it costs and what it gives."}
          # In a story, the day after a tile stopped being offered: what left (under the note, so
          # that it never moves the button). Hidden the rest of the time
          - {kind: Label, name: goneNote, style: body-sm, color: ink-muted, overflow: wrap, text: "No longer offered: Walk the halls"}

  # -- Right: what he has taken, and the record so far --
  - kind: Layout:Vertical
    name: walkRight
    z: 104
    width: 364
    height: 860
    scrollable: true
    spacing: 12
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 12}
      - {side: top, target: __MainWindow, targetSide: top, margin: 136}
    children:
      - kind: Panel
        name: takenPanel
        frame: ruled
        width: 360
        z: 104
        contentZ: 114
        heading: Taken so far
        glyph: gold
        children:
          - kind: ResourceLedger
            name: taken

      - kind: Panel
        name: recordPanel
        frame: ruled
        width: 360
        z: 104
        contentZ: 114
        heading: The record so far
        glyph: quill
        aside: 11 AP WRITTEN
        children:
          - kind: EventLog
            name: record
            height: 520
            years: false
            steps: true          # the first column counts: a step of the record, a turn of the fight
            newest: true         # the newest line on top, as a chat reads
          - {kind: Label, name: recordNote, style: gloss, color: ink-muted, overflow: wrap, text: "Every step is walked again by the record."}
