# A fight of a walk, in one column: fight.yaml for a window too narrow for its row of panels. The
# same pieces under the same names, so LifeScene fills both the same way (lifewalk.cpp): the
# head, then every panel one under the other in a column that scrolls: the order of the turn,
# the beasts, his turn, he himself, and the account. The scene writes the window's width over
# the widths drawn here before it builds the page (shapeWalk).
# z: the Overlay band, 100-129 (the veil 100, the head and the panels 104, their content 114).
name: fight
children:

  - kind: Shape2D
    name: veil
    width: 390
    height: 800
    z: 100
    theme: scene.background

  - {kind: Label, name: kicker, x: 16, y: 10, z: 104, style: label, color: ink-muted, overflow: ellipsis, width: 358, text: "THE HOLLOW WOODS · DAY 12 · A FIGHT"}
  - {kind: Label, name: fightTitle, x: 16, y: 28, z: 104, style: heading, overflow: ellipsis, width: 200, text: Wolf pack}

  - kind: Label
    name: turn
    z: 104
    style: figure-xl
    overflow: ellipsis
    width: 170
    align: right
    text: "TURN 4"
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 16}
      - {side: top, target: __MainWindow, targetSide: top, margin: 6}

  - {kind: Label, name: turnNote, x: 16, y: 64, z: 104, style: label, color: status-time, overflow: ellipsis, width: 358, text: "FIGHT COST · 3 TURNS = 1 DAY · 2 DAYS SO FAR · 17 DAYS LEFT ON SITE"}

  - kind: Layout:Vertical
    name: walkLeft
    x: 16
    y: 92
    z: 104
    width: 362
    height: 640
    scrollable: true
    spacing: 12
    children:
      - kind: Panel
        name: orderPanel
        frame: ruled
        width: 376
        z: 104
        contentZ: 114
        heading: The timeline
        glyph: time
        aside: TURN 1 OF 4 · DAY 1      # how far into his day he is (the duel's dayText)
        children:
          # Who acts when, in time: his actions over the line, the beasts' under it, the end of his day; the
          # scene draws them in this box (LifeScene::fillTimeline), the move under the mouse moving them
          - {kind: Shape2D, name: timeline, width: 344, height: 132, theme: timeline.ground}
          - {kind: Label, name: warn, style: label, color: vermilion, overflow: wrap, text: "2 BLOWS COMING · 8–14 IF ALL LAND"}
          - {kind: Label, name: quick, style: label, color: ink-muted, overflow: wrap, text: "QUICKNESS 11 AGAINST 9: HE ACTS FIRST"}

      - kind: Panel
        name: foePanel0
        frame: ruled
        width: 280
        z: 104
        contentZ: 114
        heading: First wolf
        glyph: adventure
        aside: AIMED AT       # against several, on the one his blows go to
        children:
          - {kind: Label, name: foeLife0, style: label, overflow: wrap, text: "VITALITY 12 OF 16"}
          - {kind: ProgressRule, name: foeBar0, nib: false, percent: 75}
          - {kind: Label, name: foeIntent0, style: label, color: vermilion, overflow: wrap, text: BITE}
          - {kind: ProgressRule, name: foeCast0, nib: false, small: true, percent: 0}

      - kind: Panel
        name: foePanel1
        frame: ruled
        width: 280
        z: 104
        contentZ: 114
        heading: Second wolf
        glyph: adventure
        aside: AIMED AT       # against several, on the one his blows go to
        children:
          - {kind: Label, name: foeLife1, style: label, overflow: wrap, text: "VITALITY 12 OF 16"}
          - {kind: ProgressRule, name: foeBar1, nib: false, percent: 75}
          - {kind: Label, name: foeIntent1, style: label, color: vermilion, overflow: wrap, text: BITE}
          - {kind: ProgressRule, name: foeCast1, nib: false, small: true, percent: 0}

      - kind: Panel
        name: foePanel2
        frame: ruled
        width: 280
        z: 104
        contentZ: 114
        heading: Third wolf
        glyph: adventure
        aside: AIMED AT       # against several, on the one his blows go to
        children:
          - {kind: Label, name: foeLife2, style: label, overflow: wrap, text: "VITALITY 12 OF 16"}
          - {kind: ProgressRule, name: foeBar2, nib: false, percent: 75}
          - {kind: Label, name: foeIntent2, style: label, color: vermilion, overflow: wrap, text: BITE}
          - {kind: ProgressRule, name: foeCast2, nib: false, small: true, percent: 0}

      - kind: Panel
        name: foePanel3
        frame: ruled
        width: 280
        z: 104
        contentZ: 114
        heading: Fourth wolf
        glyph: adventure
        aside: AIMED AT       # against several, on the one his blows go to
        children:
          - {kind: Label, name: foeLife3, style: label, overflow: wrap, text: "VITALITY 12 OF 16"}
          - {kind: ProgressRule, name: foeBar3, nib: false, percent: 75}
          - {kind: Label, name: foeIntent3, style: label, color: vermilion, overflow: wrap, text: BITE}
          - {kind: ProgressRule, name: foeCast3, nib: false, small: true, percent: 0}

      - kind: Panel
        name: menuPanel
        frame: ruled
        width: 616
        z: 104
        contentZ: 114
        heading: Your turn
        glyph: swordsmanship
        children:
          # Against several, the one aimed at: a button each, the scene's to make (the one aimed at
          # in lapis). Against one there is nothing to choose, and neither is there
          - {kind: Label, name: aimNote, style: label, color: ink-muted, overflow: wrap, text: AIM AT}
          - kind: Layout:Vertical
            name: aims
            spacing: 6
          # What he may do, a button each, the scene's to make: pressed, it is done. Its gloss says
          # what it would do
          - kind: Layout:Vertical
            name: moves
            spacing: 6
          - {kind: Label, name: moveNote, style: body-sm, color: ink-muted, overflow: wrap, text: "Hover a move to read what it does."}
          - kind: Button
            name: hand
            variant: quiet
            label: "Let him fight on, this turn and after"
            glyph: time
            tag: walk.hand
          # Once the fight is over: what it came to, and the way back
          - {kind: Label, name: spoils, style: body, overflow: wrap, text: ""}
          - kind: Button
            name: act
            variant: seal
            label: Back to the woods
            glyph: gate
            tag: walk.act

      - kind: Panel
        name: heroPanel
        frame: ruled
        width: 280
        z: 104
        contentZ: 114
        heading: Aldren
        glyph: strength
        children:
          - {kind: Label, name: heroVit, style: label, overflow: wrap, text: "VITALITY 49 OF 90"}
          - {kind: ProgressRule, name: heroBar, nib: false, percent: 54}
          - {kind: Label, name: low, style: label, color: vermilion, overflow: wrap, text: ""}
          # His breath, for who has learned something to spend it on: out of the stack otherwise
          - {kind: Label, name: breath, style: label, color: lapis, overflow: wrap, text: "BREATH 3 OF 5"}
          - {kind: ProgressRule, name: breathBar, nib: false, small: true, percent: 60}
          # His blow, about to go: the rule fills, then the blow is told in the account
          - {kind: Label, name: heroMove, style: label, color: ink-muted, overflow: wrap, text: HIS BLOW}
          - {kind: ProgressRule, name: heroCast, nib: false, small: true, percent: 0}
          - kind: ResourceLedger
            name: hero

      - kind: Panel
        name: accountPanel
        frame: ruled
        width: 376
        z: 104
        contentZ: 114
        heading: The account
        glyph: quill
        children:
          - kind: EventLog
            name: account
            height: 300
            years: false
            steps: true          # the first column counts: a step of the record, a turn of the fight
            newest: true         # the newest line on top, as a chat reads
          - {kind: Label, name: footnote, style: label, color: status-time, overflow: wrap, text: "WRITTEN SO FAR · 2 DAYS · −14 VITALITY · A RETREAT KEEPS THE DAYS"}
