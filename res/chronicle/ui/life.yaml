# The Life screen: the recto the player lives on.
#
# Built by LifeScene (examples/Chronicle/Scenes/lifescene.cpp): this file is layout and
# placeholder content only. The names are the contract the scene wires against; the real
# names, values and rows come from the save and the rules (examples/Chronicle/rules/*.pg) in the
# scene's startUp, and the rows of the ledgers, the activity lists and the log are added there.
#
# The page follows the window (__MainWindow, the viewport): margins 16, columns 12 apart, the
# left column 300 and the right one 360 hold their width, the right one anchored to the window's
# right edge, and the middle column - the choice alone, what he may do - takes the rest. The head
# is two lines (the title, then what he is; the world's date at the right), and the columns start
# at 70. His age is the clock's to say.
# These are the measures of the roomiest window. In a smaller one the scene writes narrower
# columns, margins and gaps over them before it builds the page (lifescene.cpp, shapeColumns):
# what stands in a panel takes its width from the panel, so nothing here gives one of its own.
# The headings say what a panel is in the plainest word (Inventory, Stats, Log).
# The chapters (the tabs) stand at the head of the choice, in place of a heading. The scene widens it and sets
# the heights of the choice and the log on every resize. His Vitality stands under the clock's
# age, at the top of the right column: it is what the life hangs on. His other parts stand with
# his skills, in what he has learned. The doors (the WindowMeters) are not on this page: the clock keeps
# their bands. Panels stack 16 apart, each anchored
# under the one above it, so a panel that grows pushes the next one down. z: page 0, panels 10,
# their content 20.
name: life
children:

  - kind: Shape2D
    name: page
    width: 1320
    height: 1020
    z: 0
    theme: scene.background

  # ── Head: who, how old, what he is ───────────────────────────────────────────
  - kind: Label
    name: title
    x: 16
    y: 10
    style: heading
    text: The Chronicle of Aldren of Bellmoor

  # What he is and where he comes from, under the title
  - kind: Label
    name: about
    x: 16
    y: 40
    style: gloss
    color: ink-muted
    overflow: ellipsis
    width: 760
    text: "Apprentice at the Bellmoor Guild · Second son of the miller, born at the mill on the Bell."

  # The world's date, at the top right: its year, then the month and its season. It began at
  # Year 0 and runs on from life to life: it says how long the chronicle has been kept
  - kind: Label
    name: date
    style: figure-xl
    overflow: ellipsis
    width: 300
    align: right
    text: "YEAR 10"
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 16}
      - {side: top, target: __MainWindow, targetSide: top, margin: 6}

  - kind: Label
    name: dateNote
    style: label
    color: ink-muted
    overflow: ellipsis
    width: 400
    align: right
    text: "MONTH 7 · SUMMER · BELLMOOR"
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 16}
      - {side: top, target: __MainWindow, targetSide: top, margin: 44}

  # ── Left: what he holds, what he has learned ─────────────────────────────────
  # One column that scrolls: it grows with him and the window does not. The two panels stack 16
  # apart in it, and when they are taller than the window leaves them the wheel moves them, a thumb
  # at the column's right edge (4 past the panels, the scene makes it) showing where. The scene
  # sets the height on every resize.
  - kind: Layout:Vertical
    name: left
    x: 16
    y: 70
    width: 304
    height: 934
    z: 10                 # the panels' depth: a layout gives its own to what it holds, and at the page's 0 their grounds would tie with it
    scrollable: true
    spacing: 16
    children:
      - kind: Panel
        name: holds
        frame: ruled
        width: 300
        heading: Inventory
        glyph: gold
        children:
          - kind: ResourceLedger
            name: ledger

      - kind: Panel
        name: learned
        frame: ruled
        width: 300
        heading: Stats
        glyph: study
        aside: SKILLS
        children:
          # His parts first, then the skills: what he is and what he has learned read as one
          - {kind: StatLine, name: str, glossKey: parts/str, label: Strength, glyph: strength, value: 15, max: 30}
          - {kind: StatLine, name: dex, glossKey: parts/dex, label: Dexterity, glyph: dexterity, value: 11, max: 30}
          - {kind: StatLine, name: int, glossKey: parts/int, label: Intelligence, glyph: intelligence, value: 9, max: 30}
          - {kind: Ornament, ornament: divider, knot: false}
          - kind: ResourceLedger
            name: skills

  # ── Middle: the choice ───────────────────────────────────────────────────────
  - kind: Panel
    name: may
    x: 328
    y: 70
    frame: ruled
    width: 604
    children:
      # The chapters of the book, in place of a heading: the choice is the Life chapter's page
      - kind: Tabs
        name: tabs
        tag: life.tabs
        items:
          - {label: Life, glyph: quill}
          - {label: Town, glyph: town}      # not open until a life has explored the town
          - {label: Adventure, glyph: adventure}   # not there until he has somewhere to walk to
          - {label: Options, glyph: seal}   # how the game is played and lit, and the save (lifeoptions.cpp)
          # Kit, Guild and Chronicle come back as their pages are built
      - kind: ActivityList
        name: activities
        id: life.activities
        height: 846
        stripes: false
        compact: true         # a row is its name, its time and its closing, on a ground that says its kind: work that takes months, a thing done at once, what he cannot do yet. The rest is its gloss
        tileWidth: 148        # and the rows are tiles, as many to a line as fit at that width or more: three at 1320 (the list is 572 wide), more as the window widens
      # The Town page: it takes the choice's place in this column once a life has explored the town
      # (LifeScene::showTown). The places, a click on one beginning its next upgrade; what is
      # done on the spot in the town, a line each under its own heading (Buy, Sell, Make, then
      # the places); and who raised what
      - kind: Layout:Vertical
        name: town
        width: 572
        height: 846
        scrollable: true
        spacing: 12
        children:
          - kind: PlaceGrid
            name: places
            width: 572
            tileWidth: 148
          - kind: ActivityList
            name: marketRows
            id: town.market
            width: 572
            stripes: false
            compact: true
            tileWidth: 148
          - {kind: Label, name: raised, style: label, color: ink-muted, overflow: wrap, width: 572, text: ""}
      # The Adventure page: it takes the choice's place in this column once he has somewhere to walk
      # to (LifeScene::showAdventure, lifewalk.cpp). The records of the walks he made by hand, then the
      # form of a queue: the chosen record walked again, so many times, with no fight fought
      - kind: Layout:Vertical
        name: adventure
        width: 572
        height: 200
        scrollable: true
        spacing: 16
        children:
          # -- Where to walk: a line a place he knows of, the open ones first. One is chosen; under
          # the list, what a walk by hand is, and the button that sets out for the one chosen --
          - kind: Panel
            name: zonePanel
            frame: plain
            width: 572
            heading: Where to walk
            aside: "2 OPEN · 1 CLOSED"
            children:
              # The places to walk to, as the town's places are shown: a tile each, a seal for
              # each level he knows it to
              - kind: PlaceGrid
                name: zones
                width: 572
                tileWidth: 148
              - kind: Layout:Horizontal
                name: zoneGo
                width: 540
                height: 36
                spacing: 12
                children:
                  - {kind: Label, name: zoneNote, style: gloss, color: ink-muted, overflow: ellipsis, width: 220, text: "A walk he chooses day by day. The record is kept."}
                  - {kind: Button, name: walkNew, variant: ochre, label: "Set out for the Hedgerows · 1 mo", tag: walk.new}

          # -- The walks kept of the place chosen: a table, the best first. One is chosen, and its
          # button walks it once --
          - kind: Panel
            name: recordsPanel
            frame: plain
            width: 572
            heading: Records of the Hedgerows
            aside: "1 KEPT"
            children:
              - kind: ActivityList
                name: records
                id: walk.records
                stripes: false
                framed: true
                headName: WALK       # the table's head, inside its frame over its lines
                headCost: COST
                headAside: BRINGS
              - {kind: Label, name: recordsNote, style: body-sm, color: ink-faint, overflow: wrap, text: "Not yet walked. The first walk is made by hand."}

          # -- Walk it again: the walk chosen, so many times. What the walks take, use, bring and
          # teach, each a figure and its caption; then the two buttons --
          - kind: Panel
            name: queuePanel
            frame: ruled
            width: 572
            heading: Walk it again
            aside: "THE WALK OF 9 Y 9 MO"
            children:
              - kind: Layout:Horizontal
                name: queueCount
                width: 540
                height: 36
                spacing: 8
                children:
                  - {kind: Label, name: timesHead, style: label, color: ink-muted, overflow: ellipsis, width: 86, text: TIMES}
                  - {kind: Button, name: queueFewer, variant: quiet, label: "−", tag: walk.fewer}
                  - {kind: Label, name: queueTimes, style: figure, overflow: ellipsis, align: center, width: 28, text: "3"}
                  - {kind: Button, name: queueMore, variant: quiet, label: "+", tag: walk.more}
                  - {kind: Label, name: queueTotal, style: body-sm, color: ink-muted, overflow: ellipsis, width: 240, text: "· 3 mo · home at 12 y 2 mo"}
              - kind: Layout:Horizontal
                name: queueStopRow
                width: 540
                height: 36
                spacing: 8
                children:
                  - {kind: Label, name: stopHead, style: label, color: ink-muted, overflow: ellipsis, width: 86, text: STOP WHEN}
                  - {kind: Button, name: queueStop, variant: quiet, label: "Never · walk them all", tag: walk.stop}
              - {kind: Ornament, ornament: divider, knot: false}
              - kind: Layout:Horizontal
                name: forecast
                width: 540
                height: 62
                spacing: 12
                children:
                  - kind: Layout:Vertical
                    name: cellTake
                    width: 126
                    spacing: 2
                    children:
                      - {kind: Label, name: takeHead, style: label, color: ink-muted, width: 126, text: TAKES}
                      - {kind: Label, name: takeFigure, style: figure, color: status-time, overflow: ellipsis, width: 126, text: "3 mo"}
                      - {kind: Label, name: takeNote, style: caption, color: ink-muted, overflow: ellipsis, width: 126, text: "−9 vitality"}
                  - {kind: Shape2D, name: cellUseRule, width: 1, height: 56, theme: activity.row.rule}
                  - kind: Layout:Vertical
                    name: cellUse
                    width: 126
                    spacing: 2
                    children:
                      - {kind: Label, name: useHead, style: label, color: ink-muted, width: 126, text: USES}
                      - {kind: Label, name: useFigure, style: figure, overflow: ellipsis, width: 126, text: "nothing"}
                      - {kind: Label, name: useNote, style: caption, color: ink-muted, overflow: ellipsis, width: 126, text: "from the bag"}
                  - {kind: Shape2D, name: cellBringRule, width: 1, height: 56, theme: activity.row.rule}
                  - kind: Layout:Vertical
                    name: cellBring
                    width: 126
                    spacing: 2
                    children:
                      - {kind: Label, name: bringHead, style: label, color: ink-muted, width: 126, text: BRINGS}
                      - {kind: Label, name: bringFigure, style: figure, color: status-gain, overflow: ellipsis, width: 126, text: "+33"}
                      - {kind: Label, name: bringNote, style: caption, color: ink-muted, overflow: ellipsis, width: 126, text: "berries, rolled anew"}
                  - {kind: Shape2D, name: cellTeachRule, width: 1, height: 56, theme: activity.row.rule}
                  - kind: Layout:Vertical
                    name: cellTeach
                    width: 126
                    spacing: 2
                    children:
                      - {kind: Label, name: teachHead, style: label, color: ink-muted, width: 126, text: TEACHES}
                      - {kind: Label, name: teachFigure, style: figure, color: lapis, overflow: ellipsis, width: 126, text: "+9"}
                      - {kind: Label, name: teachNote, style: caption, color: ink-muted, overflow: ellipsis, width: 126, text: "study · level 3 at +6"}
              - {kind: Ornament, ornament: divider, knot: false}
              - {kind: Label, name: queueWarn, style: gloss, color: vermilion, overflow: wrap, text: ""}
              - kind: Layout:Horizontal
                name: queueGo
                width: 540
                height: 36
                spacing: 8
                children:
                  - {kind: Label, name: queueSpacer, style: label, overflow: ellipsis, width: 100, text: " "}
                  - {kind: Button, name: walkOnce, variant: quiet, label: "Walk once · 1 mo", tag: walk.once}
                  - {kind: Button, name: walkMany, variant: ochre, label: "Queue 3 · 3 mo", tag: walk.many}

          # -- While a queue runs, in the form's place: which walk of how many, how far along, and
          # the button that ends the queue with this walk --
          - kind: Panel
            name: workPanel
            frame: ruled
            width: 572
            heading: At work now
            children:
              - {kind: Label, name: atWalk, style: label, color: status-gain, overflow: wrap, text: "WALK 1 OF 3"}
              - {kind: ProgressRule, name: queueBar, nib: false, percent: 20, forecast: 100}
              - {kind: Button, name: queueLast, variant: quiet, label: "Finish this walk, then stop", tag: walk.last}

          # -- The foot: what the scribe says of the place, at his age. Never anything the game counts --
          - {kind: Label, name: footLine, style: gloss, color: ink-muted, overflow: wrap, width: 572, text: ""}

      # The Options page (LifeScene::showOptions, lifeoptions.cpp): it takes the choice's place in
      # this column, as the Town page does. How the game is played and lit, which this machine keeps
      # (in the save's file, beside the life), then the save itself: what it is, a copy
      # taken out of the game, one brought in, and the chronicle burnt. The scene writes every
      # width here on each resize (fitOptions) and the rows' heights from what their text takes
      - kind: Layout:Vertical
        name: options
        width: 572
        height: 846
        scrollable: true
        spacing: 16
        children:
          - kind: Panel
            name: playPanel
            frame: ruled
            width: 572
            heading: Play
            children:
              - {kind: Label, name: clickHead, style: label, color: ink-muted, overflow: ellipsis, text: BEGIN ON FIRST CLICK}
              - kind: Layout:Horizontal
                name: clickRow
                width: 540
                height: 44
                spacing: 16
                children:
                  - {kind: Label, name: clickLine, style: body-sm, overflow: wrap, width: 420, text: "A task starts the moment it is clicked. When this is off, a click only chooses a task, and Begin or a double click starts it."}
                  - {kind: Switch, name: clickSwitch, tag: options.click}
              - {kind: Ornament, ornament: divider, knot: false, weight: hair}
              - {kind: Label, name: lightHead, style: label, color: ink-muted, overflow: ellipsis, text: LIGHT OF THE PAGE}
              - {kind: Label, name: lightLine, style: body-sm, overflow: wrap, text: "Choose how the manuscript is lit. Figures and marks stay the same in both."}
              - kind: RadioCards
                name: lightCards
                tag: options.light
                selected: day
                width: 540
                items:
                  - {id: day, label: Scriptorium, line: "Day · ink on vellum", swatch: day}
                  - {id: candle, label: Candle, line: "Night · pale ink on dark leaf", swatch: candle}
          - kind: Panel
            name: savesPanel
            frame: ruled
            width: 572
            heading: Saves
            children:
              - {kind: Label, name: chronicleHead, style: label, color: ink-muted, overflow: ellipsis, text: THIS CHRONICLE}
              - {kind: Label, name: chronicleWho, style: figure, overflow: ellipsis, text: "Aldren of Bellmoor · 23 yr"}
              - {kind: Label, name: chronicleWhere, style: body-sm, color: ink-muted, overflow: wrap, text: "Life 4 · Bellmoor · last written 19 Oct, 06:41"}
              - {kind: Label, name: chronicleLine, style: body-sm, color: ink-muted, overflow: wrap, text: "The game writes the save on its own every month. Export keeps a copy outside the game."}
              - {kind: Ornament, ornament: divider, knot: false, weight: hair}
              - {kind: Label, name: exportHead, style: label, color: ink-muted, overflow: ellipsis, text: EXPORT}
              - kind: Layout:Horizontal
                name: exportRow
                width: 540
                height: 44
                spacing: 16
                children:
                  - {kind: Label, name: exportLine, style: body-sm, overflow: wrap, width: 400, text: "Writes one file: this life, the town and all knowledge gathered."}
                  - {kind: Button, name: exportButton, variant: quiet, label: Export save, tag: options.export}
              # The file it writes; under it, a cross and a line in vermilion when it could not
              - {kind: Label, name: exportNote, style: body-sm, color: ink-muted, overflow: ellipsis, text: "chronicle-aldren-life4.sz"}
              - {kind: MarkedLabel, name: exportFail, style: body-sm, color: vermilion, mark: cross, text: "The file could not be written."}
              - {kind: Ornament, ornament: divider, knot: false, weight: hair}
              - {kind: Label, name: loadHead, style: label, color: ink-muted, overflow: ellipsis, text: LOAD}
              - kind: Layout:Horizontal
                name: loadRow
                width: 540
                height: 44
                spacing: 16
                children:
                  - {kind: Label, name: loadLine, style: body-sm, overflow: wrap, width: 400, text: "Opens a save file and replaces this chronicle with it. Export first if this one is worth keeping."}
                  - {kind: Button, name: loadButton, variant: quiet, label: "Load save…", tag: options.load}
              # Shown only when a file was refused: why, in vermilion
              - {kind: MarkedLabel, name: loadNote, style: body-sm, color: vermilion, mark: cross, text: "Not a Chronicle save"}
          # The heading is in vermilion (the scene paints it): what is here cannot be undone
          - kind: Panel
            name: burnPanel
            frame: ruled
            width: 572
            heading: Burn the chronicle
            children:
              - kind: Layout:Horizontal
                name: burnRow
                width: 540
                height: 44
                spacing: 16
                children:
                  - {kind: Label, name: burnLine, style: body-sm, overflow: wrap, width: 380, text: "Erases every life, the town, its buildings and all knowledge of places and monsters. The game returns to its first page. Nothing comes back."}
                  - {kind: Button, name: wipeButton, variant: seal, label: "Wipe all data…", tag: options.wipe}
          - {kind: Label, name: optionsFoot, style: caption, color: ink-muted, overflow: wrap, width: 572, text: "Alpha · settings are kept in the save, and stay when another is loaded or the chronicle is burnt."}

  # ── Right: the years and his life, the work at hand, what has happened ──
  - kind: Panel
    name: clockPanel
    frame: ruled
    width: 360
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 16}
      - {side: top, target: __MainWindow, targetSide: top, margin: 70}
    children:
      - kind: LifeClock
        name: clock
        startAge: 6
        endAge: 30
        age: 17.5
        milestones:
          - {age: 7}
          - {age: 13}
          - {age: 16}
          - {age: 21}
          - {age: 26}
          - {age: 30}
      # His life, under his age: at nothing, this life is lost. The hatch is what will mend
      - {kind: StatLine, name: vit, glossKey: parts/vit, label: Vitality, glyph: vitality, value: 60, max: 150}

  - kind: Panel
    name: working
    frame: ruled
    width: 360
    heading: At work now
    glyph: quill
    aside: RUNNING
    anchors:
      - {side: top, target: clockPanel, targetSide: bottom, margin: 16}
      - {side: left, target: clockPanel, targetSide: left}
    children:
      - kind: ActivityList
        name: running
        id: life.running
      # A life that has done nothing yet: what to do, over the button that does it. One line, and
      # gone with the first work begun
      - {kind: Label, name: guide, style: body-sm, color: ink-muted, overflow: ellipsis, text: "Choose a work, then press Begin"}
      # At nothing, a month passes only when he says so: shown while idle, in the row's place
      - kind: Button
        name: skip
        variant: quiet
        label: Pass a month
        glyph: time
        months: 1
        tag: life.skip
      # What is chosen in the list, or a place of the town, begins from here: in the place of the
      # button above while a tile is chosen; a second click or Enter begins it too
      - kind: Button
        name: begin
        variant: seal
        label: Begin
        glyph: quill
        months: 3
        tag: life.begin
      # The room of the button that spends written time (`haste`, after the panel) under a running
      # row: it has the line of Go on, Begin or Pass a month when one of them stands
      - kind: Layout:Horizontal
        name: hasteRow
        width: 1
        height: 36

  # Written time, spent to run the months faster: a press goes ×1, ×2, ×3 and back. Shown while
  # any is held (in his Inventory), at the right of "At work now", on the line of its last button
  - kind: Button
    name: haste
    variant: quiet
    label: "Months ×1"
    glyph: time
    tag: life.haste
    z: 20
    anchors:
      - {side: right, target: working, targetSide: right, margin: 16}
      - {side: bottom, target: working, targetSide: bottom, margin: 16}

  # At the right of Do it now (Buy, Sell at the market), for what is done at once from what he
  # holds (a sale, berries dried) or buys again (rations): the same as often as he can, in one
  # press. Shown only with such a thing chosen; the scene names it All, Sell all or Buy all, and
  # the button grows to its label. The scene hangs it at the right of Begin (showWorkButtons): a
  # name inside "At work now" is out of reach of an anchor here
  - kind: Button
    name: all
    variant: quiet
    label: All
    tag: life.all
    z: 20

  - kind: Panel
    name: happened
    frame: ruled
    width: 360
    heading: Log
    glyph: quill
    anchors:
      - {side: top, target: working, targetSide: bottom, margin: 16}
      - {side: left, target: working, targetSide: left}
    children:
      - kind: EventLog
        name: log
        newest: true          # the newest line on top, as a chat reads
        height: 300
        years: false          # no "IN HIS 14TH YEAR" over each year: a line's age says it, and the log keeps its room for the lines
        footnote: THE CHRONICLE IS WRITTEN FROM THIS LOG
