# The Life screen: the recto the player lives on.
#
# Built by LifeScene (examples/Chronicle/Scenes/lifescene.cpp): this file is layout and
# placeholder content only. The names are the contract the scene wires against; the real
# names, values and rows come from the save and the rules (examples/Chronicle/rules/*.pg) in the
# scene's startUp, and the rows of the ledgers, the activity lists and the log are added there.
#
# The page follows the window (__MainWindow, the viewport): margins 48, the left column 320 and
# the right one 360 hold their width, the right one anchored to the window's right edge, and the
# middle column - the choice alone, what he may do - takes the rest. The scene widens it and sets
# the heights of the choice and the log on every resize. His Vitality stands under the clock's
# age, at the top of the right column: it is what the life hangs on. His other parts close that
# column, under the log. The doors (the WindowMeters) are not on this page: the clock keeps
# their bands. Panels stack 16 apart, each anchored
# under the one above it, so a panel that grows pushes the next one down. z: page 0, panels 10,
# their content 20.
name: life
children:

  - kind: Shape2D
    name: page
    width: 1320
    height: 1020
    z: 0
    theme: scene.background

  # ── Head: who, how old, what he is ───────────────────────────────────────────
  - kind: Label
    name: title
    x: 48
    y: 32
    style: title
    text: The Chronicle of Aldren of Bellmoor

  - kind: Label
    name: about
    x: 48
    y: 70
    style: gloss
    color: ink-muted
    overflow: ellipsis
    width: 860
    text: "Apprentice at the Bellmoor Guild · Second son of the miller, born at the mill on the Bell."

  - kind: Label
    name: subtitle
    x: 48
    y: 94
    style: label
    color: ink-muted
    text: "THE SEVENTEENTH YEAR · SPRING · BELLMOOR"

  - kind: Label
    name: age
    style: figure-xl
    overflow: ellipsis
    width: 200
    align: right
    text: "17.5"
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 48}
      - {side: top, target: __MainWindow, targetSide: top, margin: 32}

  - kind: Label
    name: ageNote
    style: body-sm
    color: ink-muted
    overflow: ellipsis
    width: 400
    align: right
    text: years · 7 mo to the eighteenth
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 48}
      - {side: top, target: __MainWindow, targetSide: top, margin: 70}

  - kind: Tabs
    name: tabs
    x: 48
    y: 118
    tag: life.tabs
    items:
      - {label: Life, glyph: quill}
      - {label: Kit, glyph: equipment}
      - {label: Town, glyph: town}
      - {label: Guild, glyph: guild}
      - {label: Adventure, glyph: adventure}
      - {label: Chronicle, glyph: study}

  # ── Left: what he holds, what he has learned ─────────────────────────────────
  - kind: Panel
    name: holds
    x: 48
    y: 178
    frame: ruled
    width: 320
    heading: What he holds
    glyph: gold
    aside: LEDGER
    children:
      - kind: ResourceLedger
        name: ledger

  - kind: Panel
    name: learned
    frame: ruled
    width: 320
    heading: What he has learned
    glyph: study
    aside: SKILLS
    anchors:
      - {side: top, target: holds, targetSide: bottom, margin: 16}
      - {side: left, target: holds, targetSide: left}
    children:
      - kind: ResourceLedger
        name: skills

  # ── Middle: the choice ───────────────────────────────────────────────────────
  - kind: Panel
    name: may
    x: 392
    y: 178
    frame: ruled
    width: 496
    heading: What Aldren may do
    glyph: town
    aside: CHOOSE ONE
    children:
      - kind: ActivityList
        name: activities
        id: life.activities
        height: 740
        stripes: false        # one ground for every row: the tint is the hover's, the edge the selection's

  # ── Right: the years and his life, the work at hand, what has happened, his other parts ──
  - kind: Panel
    name: clockPanel
    frame: ruled
    width: 360
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 48}
      - {side: top, target: __MainWindow, targetSide: top, margin: 178}
    children:
      - kind: LifeClock
        name: clock
        startAge: 7
        endAge: 43
        age: 17.5
        nextLabel: Choose a path
        nextIn: 6
        milestones:
          - {age: 7}
          - {age: 14}
          - {age: 18}
          - {age: 25}
          - {age: 40}
          - {age: 43}
      # His life, under his age: at nothing, this life is lost. The hatch is what will mend
      - {kind: StatLine, name: vit, glossKey: parts/vit, label: Vitality, glyph: vitality, value: 12, max: 30, width: 328}

  - kind: Panel
    name: working
    frame: ruled
    width: 360
    heading: At work now
    glyph: quill
    aside: RUNNING
    anchors:
      - {side: top, target: clockPanel, targetSide: bottom, margin: 16}
      - {side: left, target: clockPanel, targetSide: left}
    children:
      - kind: ActivityList
        name: running
        id: life.running

  - kind: Panel
    name: happened
    frame: ruled
    width: 360
    heading: What has happened
    glyph: quill
    aside: LOG
    anchors:
      - {side: top, target: working, targetSide: bottom, margin: 16}
      - {side: left, target: working, targetSide: left}
    children:
      - kind: EventLog
        name: log
        height: 300
        footnote: THE CHRONICLE IS WRITTEN FROM THIS LOG

  - kind: Panel
    name: parts
    frame: ruled
    width: 360
    anchors:
      - {side: top, target: happened, targetSide: bottom, margin: 16}
      - {side: left, target: happened, targetSide: left}
    children:
      - {kind: StatLine, name: str, glossKey: parts/str, label: Strength, glyph: strength, value: 15, max: 30, width: 328}
      - {kind: StatLine, name: dex, glossKey: parts/dex, label: Dexterity, glyph: dexterity, value: 11, max: 30, width: 328}
      - {kind: StatLine, name: int, glossKey: parts/int, label: Intelligence, glyph: intelligence, value: 9, max: 30, width: 328}
