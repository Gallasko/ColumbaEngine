# The Life screen on a phone held upright: one column.
#
# LifeScene builds this file instead of life.yaml or life-compact.yaml when the window is
# narrower than 600 (a phone's browser, upright), and swaps back when it widens. The names are the
# same contract (see life.yaml); what is not here (the "about" line, the doors) has no widget.
#
# Margins 12. The head holds on three short lines: the title with the age at its right, the
# year, then the note on the age. Under it the work at hand, always in view: what he is at, and
# the button that begins what is chosen. Then one row of tabs for everything else, and under the
# tabs one thing at a time, to the bottom of the window: the choice (Life), his parts (Stats),
# what he holds (Items), the years, the log, and the town once a life has explored it. The town's
# tab is the last of the row: hidden, it leaves no gap. The panels have no heading: the tab
# names them.
#
# Every width here is a placeholder: the scene writes the column's width (the window's, less
# the margins) over them before the page is built (LifeScene, shapePhone), and builds the page
# again at another width. It sets the heights and which panel shows on every resize.
# A finger has no hover: on this page a tap on a thing shows its gloss.
# z: page 0, panels 10, content 20.
name: life
children:

  - kind: Shape2D
    name: page
    width: 390
    height: 844
    z: 0
    theme: scene.background

  # -- Head: who and how old on one line, the year and the note under it --
  - kind: Label
    name: title
    x: 12
    y: 10
    style: tab
    overflow: ellipsis
    width: 270
    text: The Chronicle of Aldren of Bellmoor

  - kind: Label
    name: age
    style: figure-xl
    overflow: ellipsis
    width: 96
    align: right
    text: "17.5"
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 12}
      - {side: top, target: __MainWindow, targetSide: top, margin: 4}

  - kind: Label
    name: subtitle
    x: 12
    y: 38
    style: label
    color: ink-muted
    text: "THE SEVENTEENTH YEAR · SPRING · BELLMOOR"

  - kind: Label
    name: ageNote
    x: 12
    y: 58
    style: body-sm
    color: ink-muted
    overflow: ellipsis
    width: 366
    text: years · 7 mo to the eighteenth

  # -- The work at hand: always in view, over the tabs --
  - kind: Panel
    name: working
    x: 12
    y: 84
    frame: ruled
    width: 366
    heading: At work now
    glyph: quill
    aside: RUNNING
    children:
      - kind: ActivityList
        name: running
        id: life.running
      - {kind: Label, name: guide, style: body-sm, color: ink-muted, overflow: ellipsis, text: "Choose a work, then press Begin"}
      - kind: Button
        name: skip
        variant: quiet
        label: Pass a month
        glyph: time
        months: 1
        tag: life.skip
      - kind: Button
        name: begin
        variant: seal
        label: Begin
        glyph: quill
        months: 3
        tag: life.begin
      # The room of the button that spends written time (`haste`, after the panel) under a running
      # row: it has the line of Go on, Begin or Pass a month when one of them stands
      - kind: Layout:Horizontal
        name: hasteRow
        width: 1
        height: 36

  # Written time, spent to run the months faster: a press goes ×1, ×2, ×3 and back. Shown while
  # any is held (in his Inventory), at the right of "At work now", on the line of its last button
  - kind: Button
    name: haste
    variant: quiet
    label: "Months ×1"
    glyph: time
    tag: life.haste
    z: 20
    anchors:
      - {side: right, target: working, targetSide: right, margin: 16}
      - {side: bottom, target: working, targetSide: bottom, margin: 16}

  # At the right of Do it now (Buy, Sell at the market), for what is done at once from what he
  # holds (a sale, berries dried) or buys again (rations): the same as often as he can, in one
  # press. Shown only with such a thing chosen; the scene names it All, Sell all or Buy all, and
  # the button grows to its label. The scene hangs it at the right of Begin (showWorkButtons): a
  # name inside "At work now" is out of reach of an anchor here
  - kind: Button
    name: all
    variant: quiet
    label: All
    tag: life.all
    z: 20

  # -- One row of tabs for everything under it. Short names, no glyph: seven of them hold in the
  #    column of a narrow phone. The town's and the walks' are the last: neither is shown until a
  #    life has something behind it --
  - kind: Tabs
    name: tabs
    tag: life.tabs
    width: 366
    anchors:
      - {side: top, target: working, targetSide: bottom, margin: 4}
      - {side: left, target: working, targetSide: left}
    items:
      - {label: Life}
      - {label: Stats}
      - {label: Items}
      - {label: Years}
      - {label: Log}
      - {label: Town}
      - {label: Walks}        # the Adventure page: not there until he has somewhere to walk to

  # -- Under the tabs, one of these at a time (LifeScene::showPhone) --
  - kind: Panel
    name: may
    frame: ruled
    width: 366
    anchors:
      - {side: top, target: tabs, targetSide: bottom}
      - {side: left, target: working, targetSide: left}
    children:
      - kind: ActivityList
        name: activities
        id: life.activities
        height: 200
        stripes: false
        compact: true
        tileWidth: 148        # two tiles to a line in a column of 334, one under 304
      # The Town page: it takes the choice's place once a life has explored the town
      - kind: Layout:Vertical
        name: town
        width: 334
        height: 200
        scrollable: true
        spacing: 12
        children:
          - kind: PlaceGrid
            name: places
            width: 334
            tileWidth: 148
          - kind: ActivityList
            name: marketRows
            id: town.market
            width: 334
            stripes: false
            compact: true
            tileWidth: 148
          - {kind: Label, name: raised, style: label, color: ink-muted, overflow: wrap, width: 334, text: ""}
      # The Adventure page: it takes the choice's place in this column once he has somewhere to walk
      # to (LifeScene::showAdventure, lifewalk.cpp). The records of the walks he made by hand, then the
      # form of a queue: the chosen record walked again, so many times, with no fight fought
      - kind: Layout:Vertical
        name: adventure
        width: 334
        height: 200
        scrollable: true
        spacing: 16
        children:
          # -- Where to walk: a line a place he knows of, the open ones first. One is chosen; under
          # the list, what a walk by hand is, and the button that sets out for the one chosen --
          - kind: Panel
            name: zonePanel
            frame: plain
            width: 334
            heading: Where to walk
            aside: "2 OPEN · 1 CLOSED"
            children:
              # The places to walk to, as the town's places are shown: a tile each, a seal for
              # each level he knows it to
              - kind: PlaceGrid
                name: zones
                width: 334
                tileWidth: 148
              - kind: Layout:Horizontal
                name: zoneGo
                width: 302
                height: 36
                spacing: 12
                children:
                  - {kind: Label, name: zoneNote, style: gloss, color: ink-muted, overflow: ellipsis, width: 220, text: "A walk he chooses day by day. The record is kept."}
                  - {kind: Button, name: walkNew, variant: ochre, label: "Set out for the Hedgerows · 1 mo", tag: walk.new}

          # -- The walks kept of the place chosen: a table, the best first. One is chosen, and its
          # button walks it once --
          - kind: Panel
            name: recordsPanel
            frame: plain
            width: 334
            heading: Records of the Hedgerows
            aside: "1 KEPT"
            children:
              - kind: ActivityList
                name: records
                id: walk.records
                stripes: false
                framed: true
                headName: WALK       # the table's head, inside its frame over its lines
                headCost: COST
                headAside: BRINGS
              - {kind: Label, name: recordsNote, style: body-sm, color: ink-faint, overflow: wrap, text: "Not yet walked. The first walk is made by hand."}

          # -- Walk it again: the walk chosen, so many times. What the walks take, use, bring and
          # teach, each a figure and its caption; then the two buttons --
          - kind: Panel
            name: queuePanel
            frame: ruled
            width: 334
            heading: Walk it again
            aside: "THE WALK OF 9 Y 9 MO"
            children:
              - kind: Layout:Horizontal
                name: queueCount
                width: 302
                height: 36
                spacing: 8
                children:
                  - {kind: Label, name: timesHead, style: label, color: ink-muted, overflow: ellipsis, width: 86, text: TIMES}
                  - {kind: Button, name: queueFewer, variant: quiet, label: "−", tag: walk.fewer}
                  - {kind: Label, name: queueTimes, style: figure, overflow: ellipsis, align: center, width: 28, text: "3"}
                  - {kind: Button, name: queueMore, variant: quiet, label: "+", tag: walk.more}
                  - {kind: Label, name: queueTotal, style: body-sm, color: ink-muted, overflow: ellipsis, width: 240, text: "· 3 mo · home at 12 y 2 mo"}
              - kind: Layout:Horizontal
                name: queueStopRow
                width: 302
                height: 36
                spacing: 8
                children:
                  - {kind: Label, name: stopHead, style: label, color: ink-muted, overflow: ellipsis, width: 86, text: STOP WHEN}
                  - {kind: Button, name: queueStop, variant: quiet, label: "Never · walk them all", tag: walk.stop}
              - {kind: Ornament, ornament: divider, knot: false}
              - kind: Layout:Horizontal
                name: forecast
                width: 302
                height: 62
                spacing: 12
                children:
                  - kind: Layout:Vertical
                    name: cellTake
                    width: 66
                    spacing: 2
                    children:
                      - {kind: Label, name: takeHead, style: label, color: ink-muted, width: 66, text: TAKES}
                      - {kind: Label, name: takeFigure, style: figure, color: status-time, overflow: ellipsis, width: 66, text: "3 mo"}
                      - {kind: Label, name: takeNote, style: caption, color: ink-muted, overflow: ellipsis, width: 66, text: "−9 vitality"}
                  - {kind: Shape2D, name: cellUseRule, width: 1, height: 56, theme: activity.row.rule}
                  - kind: Layout:Vertical
                    name: cellUse
                    width: 66
                    spacing: 2
                    children:
                      - {kind: Label, name: useHead, style: label, color: ink-muted, width: 66, text: USES}
                      - {kind: Label, name: useFigure, style: figure, overflow: ellipsis, width: 66, text: "nothing"}
                      - {kind: Label, name: useNote, style: caption, color: ink-muted, overflow: ellipsis, width: 66, text: "from the bag"}
                  - {kind: Shape2D, name: cellBringRule, width: 1, height: 56, theme: activity.row.rule}
                  - kind: Layout:Vertical
                    name: cellBring
                    width: 66
                    spacing: 2
                    children:
                      - {kind: Label, name: bringHead, style: label, color: ink-muted, width: 66, text: BRINGS}
                      - {kind: Label, name: bringFigure, style: figure, color: status-gain, overflow: ellipsis, width: 66, text: "+33"}
                      - {kind: Label, name: bringNote, style: caption, color: ink-muted, overflow: ellipsis, width: 66, text: "berries, rolled anew"}
                  - {kind: Shape2D, name: cellTeachRule, width: 1, height: 56, theme: activity.row.rule}
                  - kind: Layout:Vertical
                    name: cellTeach
                    width: 66
                    spacing: 2
                    children:
                      - {kind: Label, name: teachHead, style: label, color: ink-muted, width: 66, text: TEACHES}
                      - {kind: Label, name: teachFigure, style: figure, color: lapis, overflow: ellipsis, width: 66, text: "+9"}
                      - {kind: Label, name: teachNote, style: caption, color: ink-muted, overflow: ellipsis, width: 66, text: "study · level 3 at +6"}
              - {kind: Ornament, ornament: divider, knot: false}
              - {kind: Label, name: queueWarn, style: gloss, color: vermilion, overflow: wrap, text: ""}
              - kind: Layout:Horizontal
                name: queueGo
                width: 302
                height: 36
                spacing: 8
                children:
                  - {kind: Label, name: queueSpacer, style: label, overflow: ellipsis, width: 100, text: " "}
                  - {kind: Button, name: walkOnce, variant: quiet, label: "Walk once · 1 mo", tag: walk.once}
                  - {kind: Button, name: walkMany, variant: ochre, label: "Queue 3 · 3 mo", tag: walk.many}

          # -- While a queue runs, in the form's place: which walk of how many, how far along, and
          # the button that ends the queue with this walk --
          - kind: Panel
            name: workPanel
            frame: ruled
            width: 334
            heading: At work now
            children:
              - {kind: Label, name: atWalk, style: label, color: status-gain, overflow: wrap, text: "WALK 1 OF 3"}
              - {kind: ProgressRule, name: queueBar, nib: false, percent: 20, forecast: 100}
              - {kind: Button, name: queueLast, variant: quiet, label: "Finish this walk, then stop", tag: walk.last}

          # -- The foot: what the scribe says of the place, at his age. Never anything the game counts --
          - {kind: Label, name: footLine, style: gloss, color: ink-muted, overflow: wrap, width: 334, text: ""}

  - kind: Panel
    name: parts
    frame: ruled
    width: 366
    anchors:
      - {side: top, target: tabs, targetSide: bottom}
      - {side: left, target: working, targetSide: left}
    children:
      - {kind: StatLine, name: vit, glossKey: parts/vit, label: Vitality, glyph: vitality, value: 60, max: 150}
      - {kind: Ornament, ornament: divider, knot: false}
      - {kind: StatLine, name: str, glossKey: parts/str, label: Strength, glyph: strength, value: 15, max: 30}
      - {kind: StatLine, name: dex, glossKey: parts/dex, label: Dexterity, glyph: dexterity, value: 11, max: 30}
      - {kind: StatLine, name: int, glossKey: parts/int, label: Intelligence, glyph: intelligence, value: 9, max: 30}
      - {kind: Ornament, ornament: divider, knot: false}
      - kind: ResourceLedger
        name: skills

  - kind: Panel
    name: holds
    frame: ruled
    width: 366
    anchors:
      - {side: top, target: tabs, targetSide: bottom}
      - {side: left, target: working, targetSide: left}
    children:
      - kind: ResourceLedger
        name: ledger

  - kind: Panel
    name: clockPanel
    frame: ruled
    width: 366
    anchors:
      - {side: top, target: tabs, targetSide: bottom}
      - {side: left, target: working, targetSide: left}
    children:
      - kind: LifeClock
        name: clock
        startAge: 6
        endAge: 30
        age: 17.5
        milestones:
          - {age: 7}
          - {age: 13}
          - {age: 16}
          - {age: 21}
          - {age: 26}
          - {age: 30}

  - kind: Panel
    name: happened
    frame: ruled
    width: 366
    anchors:
      - {side: top, target: tabs, targetSide: bottom}
      - {side: left, target: working, targetSide: left}
    children:
      - kind: EventLog
        name: log
        newest: true          # the newest line on top, as a chat reads
        height: 300
        years: false
        footnote: THE CHRONICLE IS WRITTEN FROM THIS LOG
