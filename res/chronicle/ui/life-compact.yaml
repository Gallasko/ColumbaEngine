# The Life screen, compact: the same page for a small window (800x600 and up).
#
# LifeScene builds this file instead of life.yaml when the window is too small for three columns,
# and swaps back when it grows. The names are the same contract (see life.yaml); what is not here
# (the "about" line) simply has no widget.
#
# Margins 24. The head holds on two lines: the title with the age at its right, then the year
# with the note on the age. Under the tabs, two columns: on the left the work at hand over the
# choice, which takes the window's width and height; on the right a column of 320 showing one
# panel at a time - his parts, what he holds, the years, the log - picked by the small tabs on
# top of it. The side panels have no heading: the tab names them. The scene sets the widths,
# the heights and which side panel shows on every resize. z: page 0, panels 10, content 20.
name: life
children:

  - kind: Shape2D
    name: page
    width: 800
    height: 600
    z: 0
    theme: scene.background

  # ── Head: who and how old on one line, the year under it ──────────────────────
  - kind: Label
    name: title
    x: 24
    y: 16
    style: title
    overflow: ellipsis
    width: 632
    text: The Chronicle of Aldren of Bellmoor

  - kind: Label
    name: age
    style: figure-xl
    overflow: ellipsis
    width: 120
    align: right
    text: "17.5"
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 24}
      - {side: top, target: __MainWindow, targetSide: top, margin: 16}

  - kind: Label
    name: subtitle
    x: 24
    y: 54
    style: label
    color: ink-muted
    text: "THE SEVENTEENTH YEAR · SPRING · BELLMOOR"

  - kind: Label
    name: ageNote
    style: body-sm
    color: ink-muted
    overflow: ellipsis
    width: 300
    align: right
    text: years · 7 mo to the eighteenth
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 24}
      - {side: top, target: __MainWindow, targetSide: top, margin: 54}

  - kind: Tabs
    name: tabs
    x: 24
    y: 72
    tag: life.tabs
    items:
      - {label: Life, glyph: quill}
      - {label: Kit, glyph: equipment}
      - {label: Town, glyph: town}
      - {label: Guild, glyph: guild}
      - {label: Adventure, glyph: adventure}
      - {label: Chronicle, glyph: study}

  # ── Main: the work at hand, then the choice ───────────────────────────────────
  - kind: Panel
    name: working
    x: 24
    y: 128
    frame: ruled
    width: 436
    heading: At work now
    glyph: quill
    aside: RUNNING
    children:
      - kind: ActivityList
        name: running
        id: life.running

  - kind: Panel
    name: may
    frame: ruled
    width: 436
    heading: What Aldren may do
    glyph: town
    aside: CHOOSE ONE
    anchors:
      - {side: top, target: working, targetSide: bottom, margin: 16}
      - {side: left, target: working, targetSide: left}
    children:
      - kind: ActivityList
        name: activities
        id: life.activities
        height: 200
        stripes: false        # one ground for every row: the tint is the hover's, the edge the selection's

  # ── Side: one panel at a time ─────────────────────────────────────────────────
  - kind: Tabs
    name: sideTabs
    tag: life.side
    width: 320            # the hairline spans the column
    anchors:
      - {side: left, target: parts, targetSide: left}
      - {side: top, target: __MainWindow, targetSide: top, margin: 128}
    items:
      - {label: Parts}
      - {label: Holds}
      - {label: Years}
      - {label: Log}

  - kind: Panel
    name: parts
    frame: ruled
    width: 320
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 24}
      - {side: top, target: __MainWindow, targetSide: top, margin: 180}
    children:
      - {kind: StatLine, name: str, glossKey: parts/str, label: Strength, glyph: strength, value: 15, max: 30}
      - {kind: StatLine, name: dex, glossKey: parts/dex, label: Dexterity, glyph: dexterity, value: 11, max: 30}
      - {kind: StatLine, name: int, glossKey: parts/int, label: Intelligence, glyph: intelligence, value: 9, max: 30}
      - {kind: StatLine, name: vit, glossKey: parts/vit, label: Vitality, glyph: vitality, value: 12, max: 30}
      - {kind: Ornament, ornament: divider, knot: false}
      - kind: ResourceLedger
        name: skills

  - kind: Panel
    name: holds
    frame: ruled
    width: 320
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 24}
      - {side: top, target: __MainWindow, targetSide: top, margin: 180}
    children:
      - kind: ResourceLedger
        name: ledger

  - kind: Panel
    name: clockPanel
    frame: ruled
    width: 320
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 24}
      - {side: top, target: __MainWindow, targetSide: top, margin: 180}
    children:
      - kind: LifeClock
        name: clock
        startAge: 7
        endAge: 43
        age: 17.5
        nextLabel: Choose a path
        nextIn: 6
        milestones:
          - {age: 7}
          - {age: 14}
          - {age: 18}
          - {age: 25}
          - {age: 40}
          - {age: 43}
      - {kind: WindowMeter, name: window.ruins, glossKey: window/ruins, label: The ruins at Harrow, from: 15, to: 19, age: 17.5, state: open, note: "Open 18 more months. Six attempts fit; seven do not."}
      - {kind: WindowMeter, name: window.tourney, glossKey: window/tourney, label: The spring tourney, from: 17, to: 21, age: 17.5, state: open, note: "Open 42 more months. Fourteen attempts fit; fifteen do not."}

  - kind: Panel
    name: happened
    frame: ruled
    width: 320
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 24}
      - {side: top, target: __MainWindow, targetSide: top, margin: 180}
    children:
      - kind: EventLog
        name: log
        height: 300
        footnote: THE CHRONICLE IS WRITTEN FROM THIS LOG
